# Houdt het gratis Supabase-project actief.
# Supabase pauzeert projecten op het gratis plan na 7 dagen zonder activiteit.
# Deze workflow doet elke 3 dagen een kleine query, zodat dat niet gebeurt.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase
        env:
          # Publieke anon key (staat ook in src/services/supabase.ts; beveiligd via RLS)
          SUPABASE_URL: https://khdsnupzgzhfactvrkhn.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtoZHNudXB6Z3poZmFjdHZya2huIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk3NTY2MTksImV4cCI6MjA4NTMzMjYxOX0.7QkK4BZhZCPyhgEezKqicqE9eJvGVtXMUdqD4Pr-lAY
        run: |
          status=$(curl -sS -o response.txt -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/wines?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $status"
          cat response.txt
          if [ "$status" -ge 400 ]; then
            echo "Supabase ping mislukt"
            exit 1
          fi
